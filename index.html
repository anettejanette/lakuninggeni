<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL // LAKUNING_GENI_LABORATORY</title>
    <style>
        /* --- CORE CONFIGURATION & THEMING --- */
        :root {
            --bg-color: #0a0a0a;
            --text-primary: #00ff66;
            --text-dim: #005522;
            --border-style: 1px solid #00ff66;
            --font-stack: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            background-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-stack);
            font-size: 14px;
            line-height: 1.4;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            padding: 15px;
        }

        /* --- SCANLINE & GLITCH AESTHETIC --- */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 9999;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        /* --- UTILITIES --- */
        a {
            color: var(--text-primary);
            text-decoration: none;
            border: var(--border-style);
            padding: 2px 6px;
        }
        a:hover {
            background-color: var(--text-primary);
            color: var(--bg-color);
        }

        /* --- HEADER MATRIX --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: var(--border-style);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .meta-tags span {
            margin-right: 15px;
            font-weight: bold;
        }
        .lang-switch {
            font-size: 12px;
        }

        /* --- CENTRAL VIEWPORT (CANVAS & LOGS) --- */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
        }

        #viewport-canvas {
            width: 100%;
            flex-grow: 1;
            border: var(--border-style);
            background-color: #000;
        }

        #terminal-log {
            height: 120px;
            border: var(--border-style);
            padding: 8px;
            overflow-y: auto;
            font-size: 12px;
            color: var(--text-primary);
            background-color: #050505;
        }

        /* --- D-PAD INTERACTIVE CLUSTER --- */
        .controls-wrapper {
            display: flex;
            justify-content: center;
            margin: 15px 0;
        }

        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 45px);
            grid-template-rows: repeat(3, 45px);
            gap: 5px;
        }

        .d-btn {
            border: var(--border-style);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            user-select: none;
        }

        .d-btn:active, .d-btn.active {
            background-color: var(--text-primary);
            color: var(--bg-color);
        }

        .d-up    { grid-column: 2; grid-row: 1; }
        .d-left  { grid-column: 1; grid-row: 2; }
        .d-right { grid-column: 3; grid-row: 2; }
        .d-down  { grid-column: 2; grid-row: 3; }

        /* --- FOOTER / PARTNER NODE MATRIX --- */
        footer {
            border-top: var(--border-style);
            padding-top: 10px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .partner-node {
            max-height: 35px;
            filter: grayscale(1) brightness(1.5) contrast(2);
            opacity: 0.6;
            transition: opacity 0.2s ease;
        }

        .partner-node:hover {
            opacity: 1;
            filter: none;
        }
    </style>
</head>
<body>

    <!-- 1. TRANSMISSION HEADER -->
    <header>
        <div class="meta-tags">
            <span>[ TRANSMIT // LAKUNING_GENI ]</span>
            <span id="system-status">[INIT_OK]</span>
        </div>
        <div class="lang-switch">
            <a href="#" id="lang-toggle">WETON_SYS</a>
        </div>
    </header>

    <!-- 2. SYSTEM ENGINE VIEWPORT -->
    <main>
        <!-- The primary visualization node (Noise / Graphics) -->
        <canvas id="viewport-canvas"></canvas>
        
        <!-- The narrative/code syntax console output -->
        <div id="terminal-log">
            SYSTEM KERNEL INITIALIZED: WETON_LAKUNING_GENI.<br>
            Use D-PAD [UP / DOWN / LEFT / RIGHT] to navigate archives, metadata, and metaphorical parameters...
        </div>
    </main>

    <!-- 3. DIRECTIONAL INTERACTION INTERFACE -->
    <div class="controls-wrapper">
        <div class="d-pad">
            <div class="d-btn d-up" data-dir="UP">▲</div>
            <div class="d-btn d-left" data-dir="LEFT">◀</div>
            <div class="d-btn d-right" data-dir="RIGHT">▶</div>
            <div class="d-btn d-down" data-dir="DOWN">▼</div>
        </div>
    </div>

    <!-- 4. STERILIZED PARTNER BRANDING LOG MATRIX -->
    <footer>
        <a href="#" target="_blank"><span class="node-label">[NODE_01: DEFINISI]</span></a>
        <a href="#" target="_blank"><span class="node-label">[NODE_02: METAFORA]</span></a>
        <a href="#" target="_blank"><span class="node-label">[NODE_03: NEPTU_8]</span></a>
    </footer>

    <!-- 5. LIGHTWEIGHT RUNTIME INSTANCE -->
    <script>
        const canvas = document.getElementById('viewport-canvas');
        const ctx = canvas.getContext('2d');
        const logWindow = document.getElementById('terminal-log');

        // Database content mapping for D-pad navigation
        const databaseArchive = {
            UP: {
                title: "ARCHIVE_01 // DEFINISI & KARAKTER",
                text: "LAKUNING GENI: Berjalannya api. Energi kuat, bersemangat, tegas, berani, & mudah memancarkan pengaruh. Memiliki kemauan keras dan intensitas tinggi, namun bermuka dua: bisa menghangatkan atau membakar jika emosi tak terkendali."
            },
            LEFT: {
                title: "ARCHIVE_02 // METAFORA KEADAAN",
                text: "SIMBOLISME KONDISI:\n- Api Liar: Cepat menyala -> cepat bereaksi -> sulit berhenti -> melukai -> menyesal.\n- Api Terjaga: Tetap panas/hangat -> terarah -> memberi cahaya & tenaga -> bertahan lama. Ketenangan bukan berarti kehilangan api."
            },
            RIGHT: {
                title: "ARCHIVE_03 // BAHAN BAKAR & DESTRUKSI",
                text: "BAHAN BAKAR ENERGI: Sangat produktif jika punya tujuan jelas, keyakinan, tantangan, & ruang berekspresi. Destruktif jika tanpa saluran: berubah jadi frustrasi, overthink, ledakan emosi, atau kelelahan karena terus 'menyala'."
            },
            DOWN: {
                title: "ARCHIVE_04 // TAFSIR NEPTU 8 & BARA",
                text: "NEPTU 8 ('Cilik kaitane, gedhe pungkasane'): Dampak akhir bisa besar dari hal kecil. Menyimpan/memendam sesuatu hingga menjadi bara. Api tidak selalu berkobar; kadang ia berupa bara tenang yang siap menyala bila diberi oksigen."
            }
        };

        // Dynamically size canvas inside its CSS limits
        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
            renderNoise();
        }

        // Generate raw digital noise texture inside the workspace matrix
        function renderNoise() {
            const imgData = ctx.createImageData(canvas.width, canvas.height);
            const data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
                const noise = Math.random() > 0.5 ? 40 : 0; 
                data[i] = noise;       
                data[i+1] = noise + 20; 
                data[i+2] = noise;     
                data[i+3] = 255;       
            }
            ctx.putImageData(imgData, 0, 0);
        }

        // Loop background noise displacement to simulate systemic instability
        setInterval(() => {
            if(canvas.width > 0) renderNoise();
        }, 120);

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Bind interactive D-pad controls directly to state pipeline
        document.querySelectorAll('.d-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const direction = e.target.getAttribute('data-dir');
                executeSystemAction(direction);
            });
        });

        function executeSystemAction(action) {
            const timestamp = new Date().toLocaleTimeString();
            const record = databaseArchive[action];
            
            if (record) {
                logWindow.innerHTML += `<br><br>[${timestamp}] VECTOR: [${record.title}]<br>> ${record.text.replace(/\n/g, '<br>> ')}`;
                logWindow.scrollTop = logWindow.scrollHeight;
            }
        }
    </script>
</body>
</html>
